<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>e2e</title></head>
<body>
<div id="sb-python"></div>
<pre id="out">RUNNING</pre>
<script src="../src/telemetry.js"></script>
<script src="../src/workspace.js"></script>
<script src="../src/vfs.js"></script>
<script src="../src/network.js"></script>
<script src="../src/shell.js"></script>
<script src="../src/tools.js"></script>
<script src="../src/model-adapters.js"></script>
<script src="../src/model.js"></script>
<script src="../src/agent.js"></script>
<script>
(async () => {
  const lines = [];
  const log = (m) => { lines.push(m); document.getElementById('out').textContent = lines.join('\n'); };
  const check = (name, cond, detail) => log((cond ? 'PASS' : 'FAIL') + ' ' + name + (detail !== undefined ? ' | ' + detail : ''));
  // Any console-level fault fails the suite (no console errors / no unhandled rejections).
  window.addEventListener('error', (e) => check('window error: ' + (e && e.message), false));
  window.addEventListener('unhandledrejection', (e) => check('unhandled rejection: ' + (e && e.reason && e.reason.message || e && e.reason), false));
  try {
    // Pull the real worker source out of index.html so we test the shipped artifact.
    const html = await (await fetch('../index.html')).text();
    const m = html.match(/<script type="text\/worker" id="py-worker-src">([\s\S]*?)<\/script>/);
    if (!m) throw new Error('worker source not found in index.html');
    const wtag = document.createElement('script');
    wtag.id = 'py-worker-src';
    wtag.type = 'text/worker';
    wtag.textContent = m[1];
    document.body.appendChild(wtag);

    // Test-only in-memory workspace implementing the adapter interface.
    class MemWS extends WorkspaceAdapter {
      constructor(files) { super(); this.files = Object.assign({}, files); this.name = 'mem'; }
      _nfe(p) { const e = new Error('No such file: ' + p); e.name = 'NotFoundError'; return e; }
      async list() { return Object.keys(this.files).map((n) => ({ name: n, kind: 'file' })); }
      async read(p) { p = normalizeWorkspacePath(p); if (!(p in this.files)) throw this._nfe(p); return this.files[p]; }
      async readBytes(p) { return new TextEncoder().encode(await this.read(p)); }
      async write(p, data) { p = normalizeWorkspacePath(p); this.files[p] = typeof data === 'string' ? data : new TextDecoder().decode(data); }
      async remove(p) { p = normalizeWorkspacePath(p); if (!(p in this.files)) throw this._nfe(p); delete this.files[p]; }
      async mkdir(p) { p = normalizeWorkspacePath(p); if (p && p in this.files) { const e = new Error('type mismatch'); e.name = 'TypeMismatchError'; throw e; } }
      async exists(p) { try { p = normalizeWorkspacePath(p); } catch (e) { return false; } return p === '' || p in this.files; }
      async stat(p) {
        p = normalizeWorkspacePath(p);
        if (p === '') return { kind: 'directory', size: 0, modified: null };
        if (!(p in this.files)) throw this._nfe(p);
        return { kind: 'file', size: this.files[p].length, modified: 0 };
      }
    }

    // Wrap a legacy adapter the way asVfs does, keeping a handle on the VFS.
    function mkVfs(adapter) {
      const vfs = new VirtualWorkspace({ listCommands: () => Object.keys(SHELL_COMMANDS) });
      if (adapter) vfs.mount('/mnt/workspace', adapter, 'external-read-write');
      return vfs;
    }

    // ---------- A. workspace path escape ----------
    check('A1 path ../escape rejected', (() => { try { normalizeWorkspacePath('../escape.txt'); return false; } catch (e) { return true; } })());
    check('A2 path a/../../x rejected', (() => { try { normalizeWorkspacePath('a/../../x'); return false; } catch (e) { return true; } })());
    check('A3 path C:/win rejected', (() => { try { normalizeWorkspacePath('C:/win/x'); return false; } catch (e) { return true; } })());
    check('A4 normal path ok', normalizeWorkspacePath('a/b.txt') === 'a/b.txt');

    // ---------- C. strict tool parser ----------
    const pure = '```json\n{"tool":"bash","input":"ls"}\n```';
    const wrapped = '我来看一下目录：\n```json\n{"tool":"bash","input":"ls"}\n```\n以上是调用。';
    const sayStyle = '```json\n{"say":"hi","actions":[]}\n```';
    check('C1 pure fenced block parses', (parseToolCall(pure) || {}).input === 'ls');
    check('C2 prose-wrapped block NOT parsed', parseToolCall(wrapped) === null);
    check('C3 say-style block NOT a tool call', parseToolCall(sayStyle) === null);
    check('C4 plain text NOT a tool call', parseToolCall('完成。') === null);
    check('C5 whitespace-padded pure block parses', (parseToolCall('  \n' + pure + '\n ') || {}).input === 'ls');

    const wsRaw = new MemWS({ 'sales.csv': 'name,revenue,cost\nA,100,40\nB,200,80\nC,300,120\n' });
    const ws = mkVfs(wsRaw);

    // ---------- existing smoke: ls / cat / unsupported / cloud ----------
    check('smoke ls', (await executeTool('bash', 'ls', ws)).output === 'sales.csv');
    check('smoke cat', (await executeTool('bash', 'cat sales.csv', ws)).output.includes('A,100,40'));
    check('smoke unsupported', (await executeTool('bash', 'sudo rm x', ws)).output
      .startsWith('bash: sudo: command not available in local browser runtime'));

    // ---------- H. cloud_bash stays an unsuccessful stub ----------
    Telemetry.records.length = 0;
    const cloud = await executeTool('cloud_bash', 'ls', ws);
    check('H1 cloud_bash stub message', cloud.output === 'Cloud execution is not configured.');
    check('H2 cloud_bash success=false', cloud.success === false);
    const cloudRec = Telemetry.records[0];
    check('H3 cloud_bash telemetry failure', cloudRec && cloudRec.tool === 'cloud_bash'
      && cloudRec.backend === 'cloud' && cloudRec.success === false
      && cloudRec.error === 'Cloud execution is not configured.', JSON.stringify(cloudRec));

    // ---------- B. telemetry UTF-8 bytes ----------
    Telemetry.records.length = 0;
    await executeTool('bash', 'echo 你好', ws);
    const rec = Telemetry.records[0];
    check('B telemetry utf8 bytes', rec.input_bytes === 11 && rec.output_bytes === 6,
      'in=' + rec.input_bytes + ' out=' + rec.output_bytes);
    check('B2 window.__telemetry identity', window.__telemetry === Telemetry.records);
    // force trim past 500 and re-check reference identity
    for (let i = 0; i < 501; i++) Telemetry.record({ tool: 'x' });
    check('B3 __telemetry survives trim', window.__telemetry === Telemetry.records && Telemetry.records.length === 500);

    // ---------- D. heredoc python: quotes / JSON / multi-line ----------
    const hdCode = [
      'import json',
      'data = {\'name\': "locus", \'values\': [1, 2, 3]}',
      'print(json.dumps(data))',
      'print("single \'q\' and double \\"d\\" ok")',
      'print("line3")',
    ].join('\n');
    const hd = await executeTool('bash', "python <<'PY'\n" + hdCode + '\nPY', ws);
    check('D heredoc python', hd.success && hd.output.includes('{"name": "locus"') && hd.output.includes('line3'),
      JSON.stringify(hd.output).slice(0, 160));

    // ---------- pandas demo (V0 acceptance) ----------
    const pdCode = [
      'import pandas as pd',
      'df = pd.read_csv("sales.csv")',
      'means = df[["revenue", "cost"]].mean()',
      'out = "column,mean\\n" + "\\n".join(f"{k},{v}" for k, v in means.items()) + "\\n"',
      'open("summary.csv", "w").write(out)',
    ].join('\n');
    const pdr = await executeTool('bash', "python <<'PY'\n" + pdCode + '\nPY', ws);
    check('demo pandas summary', pdr.success && wsRaw.files['summary.csv'] === 'column,mean\nrevenue,200.0\ncost,80.0\n',
      JSON.stringify(wsRaw.files['summary.csv']));

    // ---------- F. deletion sync ----------
    await executeTool('bash', "python <<'PY'\nimport os\nos.remove('sales.csv')\nPY", ws);
    check('F deletion sync', !('sales.csv' in wsRaw.files), Object.keys(wsRaw.files).join(','));

    // ---------- G. rename semantics ----------
    const gr = await executeTool('bash', "python <<'PY'\nimport os\nos.rename('summary.csv', 'renamed.csv')\nPY", ws);
    check('G rename', !('summary.csv' in wsRaw.files) && wsRaw.files['renamed.csv'] === 'column,mean\nrevenue,200.0\ncost,80.0\n',
      Object.keys(wsRaw.files).join(','));

    // ---------- I. V0.2 acceptance chain: curl → local python → report.csv ----------
    const realFetch = window.fetch;
    window.fetch = async (url) => {
      if (String(url) === 'https://api.example.test/metrics.json') {
        return new Response(JSON.stringify({ values: [10, 20, 30] }),
          { status: 200, headers: { 'content-type': 'application/json' } });
      }
      throw new TypeError('Failed to fetch');
    };
    try {
      const dl = await executeTool('bash', 'curl -o raw.json https://api.example.test/metrics.json', ws);
      check('I1 curl download into workspace', dl.success && dl.backend === 'browser-direct'
        && dl.output.includes('[written to /mnt/workspace/raw.json,')
        && wsRaw.files['raw.json'] === '{"values":[10,20,30]}', JSON.stringify(dl.output) + ' | backend=' + dl.backend);
      const dlRec = Telemetry.records[Telemetry.records.length - 1];
      check('I1b telemetry network backend', dlRec.operation === 'network' && dlRec.backend === 'browser-direct'
        && dlRec.success === true, JSON.stringify(dlRec));
      const ana = await executeTool('bash', "python <<'PY'\nimport json\nvals = json.load(open('raw.json'))['values']\nopen('report.csv', 'w').write('metric,value\\ncount,%d\\nsum,%d\\nmean,%.1f\\n' % (len(vals), sum(vals), sum(vals)/len(vals)))\nPY", ws);
      check('I2 downloaded data processed by local Pyodide', ana.success
        && wsRaw.files['report.csv'] === 'metric,value\ncount,3\nsum,60\nmean,20.0\n',
        JSON.stringify(wsRaw.files['report.csv']));
    } finally {
      window.fetch = realFetch;
    }

    // ---------- J. REAL native FileSystemDirectoryHandle via OPFS (F01) ----------
    // LocalDirectoryWorkspace against a browser-native handle (not a mock):
    // stat options, exists() semantics, cat, append, python sync.
    try {
      const opfsRoot = await navigator.storage.getDirectory();
      const dirName = 'locus-e2e-' + Date.now();
      const dir = await opfsRoot.getDirectoryHandle(dirName, { create: true });
      const realWs = new LocalDirectoryWorkspace(dir);
      try {
        check('J1 native exists(missing) === false', (await realWs.exists('none.txt')) === false);
        await realWs.write('a.txt', 'hello\n');
        const jst = await realWs.stat('a.txt');
        check('J2 native stat file', jst.kind === 'file' && jst.size === 6, JSON.stringify(jst));
        const jcat = await executeTool('bash', 'cat a.txt', realWs);
        check('J3 native cat', jcat.success && jcat.output.replace(/\n$/, '') === 'hello', JSON.stringify(jcat.output));
        await executeTool('bash', 'echo first > log.txt', realWs);
        await executeTool('bash', 'echo second >> log.txt', realWs);
        check('J4 native append preserves content', (await realWs.read('log.txt')) === 'first\nsecond\n',
          JSON.stringify(await realWs.read('log.txt')));
        const jpy = await executeTool('bash', "python <<'PY'\ndata = open('a.txt').read()\nprint('read:' + data.strip())\nopen('py-out.txt', 'w').write(data.upper())\nPY", realWs);
        check('J5 native python sync in/out', jpy.success && jpy.output.includes('read:hello')
          && (await realWs.read('py-out.txt')) === 'HELLO\n', JSON.stringify(jpy.output).slice(0, 200));

        // F15 in a real browser: quoted > is text, not a redirect
        const jq = await executeTool('bash', 'echo ">" victim.txt', realWs);
        check('J6 quoted > writes nothing', jq.success && jq.output === '> victim.txt'
          && (await realWs.exists('victim.txt')) === false, JSON.stringify(jq.output));

        // F-01 on native handles: binary append preserves bytes exactly
        await realWs.write('bin.dat', new Uint8Array([0x00, 0xFF, 0xFE, 0x80, 0x41]));
        await executeTool('bash', 'echo X >> bin.dat', realWs);
        const jb = await realWs.readBytes('bin.dat');
        check('J7 native binary append byte-exact', Array.from(jb).join(',') === '0,255,254,128,65,88,10',
          Array.from(jb).join(','));
      } finally {
        await opfsRoot.removeEntry(dirName, { recursive: true });
      }
    } catch (e) {
      check('J0 OPFS native handle available', false, String(e && e.message || e));
    }

    // ---------- K. Python session isolation (F03): reset kills globals ----------
    // The VFS is the machine: /tmp lives in the VFS, not in the worker, so it
    // survives an interpreter reset (session isolation covers globals; the
    // filesystem persists like a real machine's would).
    await executeTool('bash', "python <<'PY'\nsecret = 'leak'\nopen('/tmp/leak.txt', 'w').write('leak')\nPY", ws);
    PythonRuntime.reset();
    const k1 = await executeTool('bash', "python <<'PY'\nimport os\ntry:\n    print('var:' + secret)\nexcept NameError:\n    print('var:gone')\nprint('tmp:' + str(os.path.exists('/tmp/leak.txt')))\nPY", ws);
    check('K1 python globals isolated after reset', k1.success && k1.output.includes('var:gone'), JSON.stringify(k1.output));
    check('K2 VFS /tmp persists across interpreter reset', k1.output.includes('tmp:True'), JSON.stringify(k1.output));

    // ---------- L. F06 capability check: Python CAN reach js.fetch ----------
    // This documents the real capability boundary (declared in README):
    // the Pyodide worker has network access via the JS bridge; the
    // anonymous-GET policy is enforced at the curl layer, not by sandboxing
    // Python. The check must print True — if it ever prints False the
    // declaration in README needs revisiting.
    const l1 = await executeTool('bash', "python <<'PY'\nimport js\nprint('js.fetch callable: ' + str(callable(js.fetch)))\nPY", ws);
    check('L1 python js bridge exposes fetch (capability documented)',
      l1.success && l1.output.includes('js.fetch callable: True'), JSON.stringify(l1.output));

    // ---------- M. cancel semantics live at the runtime boundary ----------
    // (The real UI event path — Vue cancel button click and Escape keydown —
    // is covered by the presentation e2e in tests/e2e-ui.cjs against the
    // built app. Here we keep the runtime-level guarantee: an abort signal
    // reaching the model client ends the task with no residual state.)
    {
      let modelAborted = 0;
      const hanging = new AgentSession({
        modelClient: (req, opts) => new Promise((resolve, reject) => {
          opts.signal.addEventListener('abort', () => {
            modelAborted++;
            reject(Object.assign(new Error('model request aborted'), { name: 'AbortError' }));
          });
        }),
        toolExecutor: async () => ({ output: 'ok', success: true }),
        buildSystemPrompt: buildSystemPrompt,
        emit: () => {},
      });
      const t1 = hanging.run('hang on model', { workspace: null });
      hanging.cancel();
      await t1;
      check('M1 cancel aborts the in-flight model request', modelAborted === 1, 'aborts=' + modelAborted);
      check('M2 task object cleared after cancel', hanging.task === null);
      const t2 = hanging.run('hang again', { workspace: null });
      hanging.cancel();
      hanging.cancel(); // double cancel must be safe
      await t2;
      check('M3 double cancel is safe', modelAborted === 2 && hanging.task === null, 'aborts=' + modelAborted);
    }

    // ---------- N. shell compatibility baseline (real browser runtime, real FS handles) ----------
    // The exact compound shapes models already produce in the wild must work:
    // sequencing, ls flags, find|head pipelines, invocation-local cd.
    try {
      const opfsRoot2 = await navigator.storage.getDirectory();
      const dirName2 = 'locus-e2e-sh-' + Date.now();
      const dir2 = await opfsRoot2.getDirectoryHandle(dirName2, { create: true });
      const shWs = new LocalDirectoryWorkspace(dir2);
      try {
        await shWs.write('a.md', '# A\n');
        await shWs.write('b.txt', 'one\ntwo\nthree\n');
        await shWs.write('sub/c.js', 'console.log(1)\n');

        const n1 = await executeTool('bash', "echo '=== root ==='; ls -la; echo; find . -type f | head -n 5", shWs);
        check('N1 compound: sequence + ls -la + find|head', n1.success
          && n1.output.includes('=== root ===') && n1.output.includes('sub/')
          && n1.output.includes('./a.md') && n1.output.includes('./sub/c.js'), JSON.stringify(n1.output));

        const n2 = await executeTool('bash', 'cd sub && pwd && ls', shWs);
        check('N2 cd invocation-local', n2.success && n2.output === '/mnt/workspace/sub\nc.js', JSON.stringify(n2.output));
        const n3 = await executeTool('bash', 'pwd', shWs);
        check('N3 next invocation back at the default cwd', n3.success && n3.output === '/mnt/workspace', JSON.stringify(n3.output));

        const n4 = await executeTool('bash', 'echo "a;b" && echo "x|y"', shWs);
        check('N4 quoted operators are text', n4.success && n4.output === 'a;b\nx|y', JSON.stringify(n4.output));

        const n5 = await executeTool('bash', 'grep -n two b.txt | wc -l', shWs);
        check('N5 grep|wc pipeline', n5.success && n5.output === '1', JSON.stringify(n5.output));

        const n6 = await executeTool('bash', 'cd ../../../.. && pwd', shWs);
        check('N6 cd above filesystem root rejected', !n6.success && n6.output.includes('escapes filesystem root'), JSON.stringify(n6.output));
        const n6b = await executeTool('bash', 'cd ../.. && pwd', shWs);
        check('N6b cd up to the real filesystem root works', n6b.success && n6b.output === '/', JSON.stringify(n6b.output));

        const n7 = await executeTool('bash', 'help', shWs);
        check('N7 help lists the contract', n7.success && n7.output.includes('Unix-like compatibility shell')
          && n7.output.includes('grep') && n7.output.includes('&&'), JSON.stringify(n7.output).slice(0, 100));
      } finally {
        await opfsRoot2.removeEntry(dirName2, { recursive: true });
      }
    } catch (e) {
      check('N0 OPFS shell-compat workspace available', false, String(e && e.message || e));
    }

    // ---------- O. shell compatibility round 2 (real browser runtime, real FS handles) ----------
    // || fallback, mv, rm and stdout/stderr redirection against native OPFS handles.
    try {
      const opfsRoot3 = await navigator.storage.getDirectory();
      const dirName3 = 'locus-e2e-sh2-' + Date.now();
      const dir3 = await opfsRoot3.getDirectoryHandle(dirName3, { create: true });
      const sh2Ws = new LocalDirectoryWorkspace(dir3);
      try {
        const o1 = await executeTool('bash',
          'echo hello > a.txt; mv a.txt b.txt; cat missing.txt 2> err.txt || echo fallback; cat err.txt | head -n 2; rm b.txt; ls -la',
          sh2Ws);
        check('O1 composite: redirect + mv + stderr 2> + || + rm + ls', o1.success
          && o1.output.includes('fallback') && o1.output.includes('err.txt')
          && !o1.output.includes('a.txt') && !o1.output.includes('b.txt'), JSON.stringify(o1.output));
        const o1b = await executeTool('bash', 'cat err.txt', sh2Ws);
        check('O1b stderr redirect really landed on disk', o1b.success && o1b.output.includes('cat:')
          && o1b.output.includes('missing.txt'), JSON.stringify(o1b.output));
        const o1c = await executeTool('bash', 'ls', sh2Ws);
        check('O1c mv + rm really mutated the filesystem', o1c.success && o1c.output === 'err.txt',
          JSON.stringify(o1c.output));

        const o2 = await executeTool('bash', 'cat missing.txt > all.txt 2>&1', sh2Ws);
        const o2b = await executeTool('bash', 'cat all.txt', sh2Ws);
        check('O2 > f 2>&1 merges both streams into the file', !o2.success && o2.output === ''
          && o2b.output.includes('cat:'), JSON.stringify(o2.output) + ' | ' + JSON.stringify(o2b.output));
        const o3 = await executeTool('bash', 'cat missing.txt 2>&1 > out.txt', sh2Ws);
        const o3b = await executeTool('bash', 'cat out.txt', sh2Ws);
        check('O3 2>&1 > f keeps stderr captured, stdout to file', !o3.success && o3.output.includes('cat:')
          && o3b.success && o3b.output === '', JSON.stringify(o3.output) + ' | ' + JSON.stringify(o3b.output));

        const o4 = await executeTool('bash', 'cat missing.txt 2>&1 | wc -l', sh2Ws);
        check('O4 2>&1 merges stderr into the pipeline', o4.success && o4.output === '1', JSON.stringify(o4.output));
        const o5 = await executeTool('bash', 'cat missing.txt 2> e2.txt | wc -l', sh2Ws);
        check('O5 2> file keeps stderr out of the pipeline', o5.success && o5.output === '0', JSON.stringify(o5.output));

        const o6 = await executeTool('bash', 'mv err.txt sub2/err.txt', sh2Ws);
        check('O6 mv into missing directory fails, source kept', !o6.success && o6.output.includes('no such'),
          JSON.stringify(o6.output));
        await executeTool('bash', 'echo x > d1/f1.txt; echo y > d1/f2.txt; echo z > d1/nested/f3.txt', sh2Ws);
        const o7 = await executeTool('bash', 'mv d1 d2', sh2Ws);
        const o7b = await executeTool('bash', 'find d2 -type f', sh2Ws);
        check('O7 recursive directory move', o7.success && o7b.success && o7b.output.includes('d2/f1.txt')
          && o7b.output.includes('d2/nested/f3.txt'), JSON.stringify(o7b.output));
        const o7c = await executeTool('bash', 'ls d1', sh2Ws);
        check('O7b source directory gone after move', !o7c.success, JSON.stringify(o7c.output));

        const o8 = await executeTool('bash', 'rm -rf d2', sh2Ws);
        const o8b = await executeTool('bash', 'find . -type f', sh2Ws);
        check('O8 rm -rf recursive delete', o8.success && o8b.success && !o8b.output.includes('d2'),
          JSON.stringify(o8b.output));
        const o9 = await executeTool('bash', 'rm -rf /', sh2Ws);
        const o9b = await executeTool('bash', 'ls', sh2Ws);
        check('O9 rm -rf / refused (protected root), workspace intact', !o9.success
          && o9.output.includes('rm: refusing to recursively remove protected path: /')
          && o9b.success && o9b.output.includes('err.txt'), JSON.stringify(o9.output));
        const o9c = await executeTool('bash', 'rm -rf /mnt/workspace', sh2Ws);
        check('O9c rm -rf /mnt/workspace refused (protected mount root)', !o9c.success
          && o9c.output.includes('rm: refusing to recursively remove protected path: /mnt/workspace'),
          JSON.stringify(o9c.output));

        const o10 = await executeTool('bash', 'help', sh2Ws);
        check('O10 help lists round-2 surface', o10.success && o10.output.includes('mv') && o10.output.includes('rm')
          && o10.output.includes('||') && o10.output.includes('2>&1'), JSON.stringify(o10.output).slice(0, 100));

        // Directory mv: the destination TREE itself is part of the data,
        // verified against real native handles (empty dirs included).
        await sh2Ws.mkdir('empty');
        const o11 = await executeTool('bash', 'mv empty moved-empty', sh2Ws);
        let o11gone = false;
        try { await sh2Ws.stat('empty'); } catch (e) { o11gone = true; }
        check('O11 empty dir move on native handles', o11.success && o11gone
          && (await sh2Ws.stat('moved-empty')).kind === 'directory'
          && (await sh2Ws.list('moved-empty')).length === 0, JSON.stringify(o11.output));

        await sh2Ws.mkdir('tree/empty');
        await sh2Ws.mkdir('tree/nested/also-empty');
        await sh2Ws.write('tree/file.txt', 'f\n');
        const o12 = await executeTool('bash', 'mv tree moved-tree', sh2Ws);
        let o12gone = false;
        try { await sh2Ws.stat('tree'); } catch (e) { o12gone = true; }
        check('O12 nested empty dirs survive on native handles', o12.success && o12gone
          && (await sh2Ws.stat('moved-tree/empty')).kind === 'directory'
          && (await sh2Ws.stat('moved-tree/nested/also-empty')).kind === 'directory'
          && (await sh2Ws.read('moved-tree/file.txt')) === 'f\n', JSON.stringify(o12.output));
      } finally {
        await opfsRoot3.removeEntry(dirName3, { recursive: true });
      }
    } catch (e) {
      check('O0 OPFS round-2 workspace available', false, String(e && e.message || e));
    }

    // ---------- V. the machine always has a filesystem (VFS acceptance) ----------
    {
      const bare = mkVfs(null);

      // bare-VFS shell: fixed userland view, /usr/bin is the command registry
      const v1 = await executeTool('bash', 'pwd', bare);
      check('V1 bare-VFS pwd is /home/locus', v1.success && v1.output === '/home/locus', JSON.stringify(v1.output));
      const v2 = await executeTool('bash', 'ls /', bare);
      check('V2 ls / shows the machine layout', v2.success
        && v2.output.split('\n').map((s) => s.replace(/\/$/, '')).join(' ') === 'bin home mnt tmp usr',
        JSON.stringify(v2.output));
      const v3 = await executeTool('bash', 'ls /usr/bin', bare);
      check('V3 /usr/bin is the command registry (grep present)', v3.success
        && v3.output.split('\n').includes('grep') && v3.output.split('\n').includes('python'),
        JSON.stringify(v3.output).slice(0, 120));
      const v4 = await executeTool('bash', 'ls /mnt/workspace', bare);
      check('V4 unmounted /mnt/workspace → not mounted', !v4.success && v4.output.includes('not mounted'),
        JSON.stringify(v4.output));

      // /tmp persistence across two bash calls sharing one vfs
      await executeTool('bash', 'echo persist > /tmp/v5.txt', bare);
      const v5 = await executeTool('bash', 'cat /tmp/v5.txt', bare);
      check('V5 /tmp persists across bash calls', v5.success && v5.output === 'persist\n', JSON.stringify(v5.output));

      // upload: a real browser File is readable; writes/removals refused
      const upload = bare.resolveMount('/mnt/upload').provider;
      upload.addFile(new File(['uploaded-by-user'], 'input.txt'));
      const v6 = await executeTool('bash', 'cat /mnt/upload/input.txt', bare);
      check('V6 upload File readable via cat', v6.success && v6.output === 'uploaded-by-user', JSON.stringify(v6.output));
      const v7 = await executeTool('bash', 'echo x > /mnt/upload/out.txt', bare);
      check('V7 write into upload refused', !v7.success && v7.output.includes('read-only filesystem'), JSON.stringify(v7.output));
      const v8 = await executeTool('bash', 'rm /mnt/upload/input.txt', bare);
      check('V8 rm from upload refused, file intact', !v8.success && v8.output.includes('read-only filesystem')
        && (await bare.exists('/mnt/upload/input.txt')), JSON.stringify(v8.output));

      // python os.getcwd() follows the shell default cwd in both states
      const v9 = await executeTool('bash', "python <<'PY'\nimport os\nprint(os.getcwd())\nPY", bare);
      check('V9 python cwd without workspace is /home/locus', v9.success
        && v9.output.split('\n')[0] === '/home/locus', JSON.stringify(v9.output).slice(0, 200));
      const wsV = mkVfs(new MemWS({ 'w.txt': 'in workspace' }));
      const v10 = await executeTool('bash', "python <<'PY'\nimport os\nprint(os.getcwd())\nprint(open('w.txt').read())\nPY", wsV);
      check('V10 python cwd with workspace is /mnt/workspace', v10.success
        && v10.output.split('\n')[0] === '/mnt/workspace' && v10.output.includes('in workspace'),
        JSON.stringify(v10.output).slice(0, 200));

      // python reads /mnt/upload; writes /mnt/download + /tmp + /home/locus
      const v11code = [
        "data = open('/mnt/upload/input.txt').read()",
        "print('saw:' + data)",
        "open('/mnt/download/from-python.txt', 'w').write('py:' + data)",
        "open('/tmp/py-tmp.txt', 'w').write('scratch')",
        "open('/home/locus/py-home.txt', 'w').write('home')",
      ].join('\n');
      const v11 = await executeTool('bash', "python <<'PY'\n" + v11code + "\nPY", bare);
      check('V11 python reads /mnt/upload and writes /mnt/download + /tmp + /home/locus', v11.success
        && v11.output.includes('saw:uploaded-by-user') && v11.output.includes('[written: /mnt/download/from-python.txt'),
        JSON.stringify(v11.output).slice(0, 300));
      const v12 = await executeTool('bash', 'cat /mnt/download/from-python.txt /tmp/py-tmp.txt /home/locus/py-home.txt', bare);
      check('V12 bash sees every python write', v12.success && v12.output.includes('py:uploaded-by-user')
        && v12.output.includes('scratch') && v12.output.includes('home'), JSON.stringify(v12.output));

      // python overwrite attempt of a read-only upload is reported; provider bytes unchanged
      const v13 = await executeTool('bash', "python <<'PY'\nopen('/mnt/upload/input.txt', 'w').write('hacked')\nPY", bare);
      check('V13 python write to /mnt/upload reported as failure', !v13.success, JSON.stringify(v13.output).slice(0, 300));
      const v14 = await executeTool('bash', 'cat /mnt/upload/input.txt', bare);
      check('V14 upload bytes unchanged after python write attempt', v14.success && v14.output === 'uploaded-by-user',
        JSON.stringify(v14.output));

      // bash <-> python roundtrip through /mnt/download in BOTH directions
      await executeTool('bash', 'echo shell-side > /mnt/download/from-shell.txt', bare);
      const v15 = await executeTool('bash', "python <<'PY'\nprint('py-reads:' + open('/mnt/download/from-shell.txt').read().strip())\nPY", bare);
      check('V15 python reads bash-written /mnt/download file', v15.success
        && v15.output.includes('py-reads:shell-side'), JSON.stringify(v15.output).slice(0, 200));
      const v16 = await executeTool('bash', 'cat /mnt/download/from-python.txt', bare);
      check('V16 bash reads python-written /mnt/download file', v16.success
        && v16.output === 'py:uploaded-by-user', JSON.stringify(v16.output));
    }

    // ---------- W. VFS audit remediation (real browser, REAL Pyodide worker) ----------
    // Adversarial reproductions for findings F-01/F-02/F-03/F-05 — the unit
    // suite uses a fake Pyodide; here the real worker proves the mirror
    // actually materializes empty dirs and the commits really land.
    {
      const bare2 = mkVfs(null);

      // F-01: binary >> and 2>> are byte-preserving
      await bare2.write('/tmp/bin.dat', new Uint8Array([0x00, 0xFF, 0xFE, 0x80, 0x41]));
      const w1 = await executeTool('bash', 'echo X >> /tmp/bin.dat', bare2);
      const w1b = await bare2.readBytes('/tmp/bin.dat');
      check('W1 binary >> preserves original bytes exactly', w1.success
        && Array.from(w1b).join(',') === '0,255,254,128,65,88,10', Array.from(w1b).join(','));
      await bare2.write('/tmp/err.dat', new Uint8Array([0x89, 0x50, 0x4E, 0x47]));
      const w2 = await executeTool('bash', 'cat /definitely-missing 2>> /tmp/err.dat', bare2);
      const w2b = await bare2.readBytes('/tmp/err.dat');
      check('W2 binary 2>> preserves original bytes exactly', !w2.success
        && w2b[0] === 0x89 && w2b[1] === 0x50 && w2b[2] === 0x4E && w2b[3] === 0x47 && w2b.byteLength > 4,
        Array.from(w2b.slice(0, 4)).join(','));

      // F-02: a REAL empty VFS directory is a valid Python cwd
      await bare2.mkdir('/tmp/emptydir');
      const w3 = await executeTool('bash', 'cd /tmp/emptydir && python -c "import os; print(os.getcwd())"', bare2);
      check('W3 python cwd in an empty /tmp dir', w3.success
        && w3.output.split('\n')[0] === '/tmp/emptydir', JSON.stringify(w3.output).slice(0, 200));
      const w3b = await executeTool('bash', 'cd /home/locus/.skills && python -c "import os; print(os.getcwd())"', bare2);
      check('W3b python cwd in empty ~/.skills', w3b.success
        && w3b.output.split('\n')[0] === '/home/locus/.skills', JSON.stringify(w3b.output).slice(0, 200));
      await bare2.mkdir('/mnt/download/empty');
      const w3c = await executeTool('bash', 'cd /mnt/download/empty && python -c "import os; print(os.getcwd())"', bare2);
      check('W3c python cwd in an empty /mnt/download dir', w3c.success
        && w3c.output.split('\n')[0] === '/mnt/download/empty', JSON.stringify(w3c.output).slice(0, 200));

      // F-03: python-created (nested) empty directories persist to the VFS
      const w4 = await executeTool('bash', "python -c \"import os; os.makedirs('/mnt/download/pya/b/c')\"", bare2);
      const w4ls = await executeTool('bash', 'ls /mnt/download/pya/b', bare2);
      check('W4 python makedirs persists, visible to the shell', w4.success
        && w4.output.includes('[mkdir: /mnt/download/pya, /mnt/download/pya/b, /mnt/download/pya/b/c]')
        && w4ls.success && w4ls.output === 'c/', JSON.stringify(w4.output).slice(0, 300));

      // F-03: python rmdir persists too
      const w5 = await executeTool('bash', "python -c \"import os; os.rmdir('/mnt/download/empty')\"", bare2);
      check('W5 python rmdir persists', w5.success && !(await bare2.exists('/mnt/download/empty')),
        JSON.stringify(w5.output).slice(0, 200));

      // F-03: read-only mounts reject directory creation — provider untouched
      const w6 = await executeTool('bash', "python -c \"import os; os.mkdir('/mnt/upload/nope')\"", bare2);
      check('W6 python mkdir on /mnt/upload refused (read-only)', !w6.success
        && w6.output.includes('read-only filesystem')
        && (await bare2.list('/mnt/upload')).length === 0, JSON.stringify(w6.output).slice(0, 300));

      // F-05: curl -o onto a DIRECTORY performs ZERO network requests
      let w7calls = 0;
      const realFetch2 = window.fetch;
      window.fetch = async () => { w7calls++; throw new TypeError('Failed to fetch'); };
      try {
        const w7 = await executeTool('bash', 'curl -o /mnt/download https://example.test/x', bare2);
        check('W7 curl -o directory target: fails before network (0 fetches)', !w7.success
          && w7.output.includes('is a directory') && w7calls === 0, w7.output + ' | fetches=' + w7calls);
      } finally {
        window.fetch = realFetch2;
      }
    }

    // ---------- E. python timeout + worker recovery (runs last) ----------
    const t0 = performance.now();
    const to = await executeTool('bash', "python <<'PY'\nwhile True:\n    pass\nPY", ws);
    const dur = Math.round(performance.now() - t0);
    check('E1 timeout error', !to.success && to.output.includes('python execution timed out after 30000ms'),
      dur + 'ms | ' + JSON.stringify(to.output).slice(0, 120));
    check('E2 worker reset to cold', PythonRuntime.worker === null && PythonRuntime.status === 'cold');
    const rec2 = await executeTool('bash', "python <<'PY'\nprint(1 + 1)\nPY", ws);
    check('E3 recovery print(1+1)=2', rec2.success && rec2.output.trim().startsWith('2'),
      JSON.stringify(rec2.output).slice(0, 120));

    log('telemetry records: ' + Telemetry.records.length);
    log(lines.some((l) => l.startsWith('FAIL')) ? 'E2E-FAIL (see above)' : 'DONE');
  } catch (e) {
    log('E2E-FAIL: ' + (e && e.stack || e));
  }
})();
</script>
