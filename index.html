<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locus — Browser Agent Runtime</title>
</head>
<body>
<div id="app"></div>

<!--
  Pyodide Web Worker source.
  Kept inline (loaded via Blob URL) so the runtime also works when the
  page is served from any static host — browsers block Worker('...js')
  on file origins. The Vue build never touches this block; the runtime
  (src/shell.js) pulls the source out by id.
-->
<script type="text/worker" id="py-worker-src">
// ============================================================
//  PYODIDE WORKER  (protocol v2.1 — adds directory semantics)
//  Loads Pyodide lazily on first run, executes Python against an
//  in-memory mirror of the VFS data mounts, and reports back
//  stdout / stderr / tracebacks / changed files+dirs (ABSOLUTE paths).
//
//  Message in:  { id, cmd: 'run', code, cwd,
//                 mounts: [{ root, readOnly,
//                            files: [{ path(ABS), b64 }],
//                            directories: [ABS] }] }
//  Result out:  { id, type: 'result', stdout, stderr, error,
//                 files: [{ path(ABS), b64 }], deleted: [ABS files],
//                 createdDirs: [ABS], deletedDirs: [ABS],
//                 uncollectedFiles: [ABS],
//                 stdoutTruncated, stderrTruncated }
//  `deleted` is FILES ONLY; directory creates/removals are reported in
//  their own fields (createdDirs parent-first, deletedDirs child-first).
// ============================================================
const PYODIDE_BASE = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';

// Harness-owned runtime packages: the ONLY Pyodide packages the worker
// ever downloads, ONCE, during bootstrap and ALWAYS before user code
// exists. What gets fetched is a code-auditable harness decision — never
// a side effect of a model-generated import (user-driven
// loadPackagesFromImports is deliberately not part of this protocol).
const PYTHON_RUNTIME_PACKAGES = ['pandas'];

let py = null;
let pyodideLoading = null;
// Bootstrap state machine: 'cold' -> 'booting' -> 'locked'. User code
// only ever executes in the 'locked' phase, i.e. after the interpreter,
// the declared package set AND the network lockdown are all in place.
let bootPhase = 'cold';
// Set the moment a lockdown application is attempted: once true, a failed
// bootstrap leaves the worker PERMANENTLY failed (its own bootstrap
// primitives are no longer pristine, so a same-worker retry would run user
// code half-locked). The worker then self-destructs and the shell rebuilds.
let lockdownAttempted = false;

// ---- user-code authority boundary (denies, not a bridge) ----
// Model-generated Python is LOCAL computation + filesystem. HTTP/HTTPS
// belongs to the shell `curl` command, where NetworkRuntime owns
// transport, approval and bounds. These denials are the technical
// boundary; system-prompt wording only documents it.
function denyUserNetwork() {
  throw new Error('Python network access is disabled in Locus; use the shell curl command for HTTP/HTTPS');
}
function denyRuntimeBootstrap() {
  throw new Error('Python package loading is controlled by the Locus runtime; declared runtime packages are provided automatically');
}

// A denied primitive is a callable whose every USE — call or construct —
// raises the same bounded denial. Property READS stay readable: Pyodide's
// own object introspection probes these global slots generically
// (filteredHasKey while wrapping globalThis for the `js` module) and must
// not explode, and a denied fetch's .call/.bind resolve to ordinary methods
// whose invocation still routes through the denied [[Call]]. The ONE read
// that would rebuild an escape hatch — .constructor, which hands back the
// pristine Function intrinsic — is denied.
function makeDenied() {
  const denied = function () { denyUserNetwork(); };
  try { Object.defineProperty(denied, '__locusNetworkDenied', { value: true }); } catch (e) {}
  return new Proxy(denied, {
    apply() { denyUserNetwork(); },
    construct() { denyUserNetwork(); },
    get(target, prop) {
      if (prop === 'constructor') denyUserNetwork();
      const v = target[prop];
      return typeof v === 'function' ? v.bind(target) : v;
    },
  });
}

// Worker-global network and dynamic-execution primitives denied to user
// code. Names this browser does not define are skipped (nothing to
// lock); the REQUIRED set below must come out locked or bootstrap fails
// closed — the worker never runs Python half-locked. `eval` is denied
// because reachable dynamic-JS execution would otherwise rebuild network
// primitives (js.eval / run_js) — Pyodide's own run_js routes through
// js.eval, so it dies with it.
//
// KNOWN RESIDUAL (F04a-R1, measured): the global `Function` constructor is
// deliberately NOT denied — Pyodide's own glue calls it internally and
// runPythonAsync breaks without it (runPythonAsync then fails with
// "globals must be a real dict"). User code can therefore still reach
// dynamic JS via js.Function or any native function's .constructor, and a
// dynamic import() from there performs a real GET (see README, F04a-R1).
const DENY_NAMES = ['fetch', 'XMLHttpRequest', 'WebSocket', 'EventSource',
  'WebTransport', 'Worker', 'SharedWorker', 'RTCPeerConnection',
  'importScripts', 'caches', 'fetchLater', 'eval', 'loadPyodide'];
const REQUIRED_LOCKED = ['fetch', 'XMLHttpRequest', 'WebSocket', 'importScripts', 'eval', 'loadPyodide'];

// Nearest object in the prototype chain that OWNS a property — the WebIDL
// accessors live on the scope prototype, not on the global instance.
function ownerOf(obj, name) {
  let cur = obj;
  while (cur) {
    if (Object.prototype.hasOwnProperty.call(cur, name)) return cur;
    cur = Object.getPrototypeOf(cur);
  }
  return null;
}

function applyNetworkLockdown(instance) {
  const g = globalThis;
  for (const name of DENY_NAMES) {
    if (!(name in g)) continue; // absent in this browser: nothing to lock
    const denied = makeDenied();
    // Lock the global slot AND the owning prototype level: user Python
    // reads through self, but the ORIGINAL accessor lives one level up,
    // and Object.getPrototypeOf(js) would otherwise hand it back.
    Object.defineProperty(g, name, { value: denied, writable: false, configurable: false });
    const owner = ownerOf(g, name);
    if (owner && owner !== g) {
      Object.defineProperty(owner, name, { value: denied, writable: false, configurable: false });
    }
  }
  // KNOWN RESIDUAL (measured, deliberately NOT closed here): a native
  // function's .constructor hands back the PRISTINE Function intrinsic
  // (js.console.log.constructor("import('https://…')") performs a real
  // network fetch), and denying Function.prototype.constructor BREAKS
  // Pyodide's own interop (its JS glue identity-checks .constructor while
  // crossing the PyProxy boundary — runPythonAsync then fails with
  // "globals must be a real dict"). The slot therefore stays intact; the
  // global eval/Function/loadPyodide denials below still close the direct
  // dynamic-JS paths. Fully closing the reconstruction path needs a
  // document-level CSP (blob workers inherit it) or an isolated-origin
  // worker — out of scope for this boundary.
  // String-compile timers are eval in disguise ("code" handlers). Real
  // function handlers keep working (Pyodide/Emscripten schedule functions).
  for (const timer of ['setTimeout', 'setInterval']) {
    const orig = typeof g[timer] === 'function' ? g[timer].bind(g) : null;
    if (!orig) continue;
    const safe = function (handler) {
      if (typeof handler !== 'function') denyUserNetwork();
      return orig.apply(null, arguments);
    };
    Object.defineProperty(g, timer, { value: safe, writable: false, configurable: false });
  }
  // Event-handler ATTRIBUTES compile assigned strings as function bodies
  // (self.onmessage = "import('https://…')" is remote JS execution). Lock
  // the slots at their current values — the worker's own handler stays.
  for (const handler of ['onmessage', 'onmessageerror', 'onerror', 'onlanguagechange',
    'onoffline', 'ononline', 'onrejectionhandled', 'onunhandledrejection']) {
    if (!(handler in g)) continue;
    try {
      Object.defineProperty(g, handler, { value: g[handler], writable: false, configurable: false });
    } catch (e) {}
  }
  for (const name of REQUIRED_LOCKED) {
    const v = g[name];
    if (!v || v.__locusNetworkDenied !== true) {
      throw new Error('Python worker failed to apply the network lockdown');
    }
  }
  // The bootstrap package loader must not be re-enterable from user code:
  // pyodide.loadPackage / Python-side loadPackagesFromImports route here.
  const loaderDenial = function () { denyRuntimeBootstrap(); };
  for (const loader of ['loadPackage', 'loadPackagesFromImports']) {
    Object.defineProperty(instance, loader, { value: loaderDenial, writable: false, configurable: false });
  }
}

// Pyodide is loaded lazily on the first run. Bootstrap order is the
// authority boundary: core runtime -> declared packages -> NETWORK
// LOCKDOWN -> ready. Bootstrap traffic (CDN core + pandas closure) uses
// the pristine primitives; no user code has executed yet.
async function ensureLockedPyodide() {
  if (bootPhase === 'locked' && py) return py;
  if (!pyodideLoading) {
    bootPhase = 'booting';
    pyodideLoading = (async () => {
      importScripts(PYODIDE_BASE + 'pyodide.js');
      const instance = await loadPyodide({ indexURL: PYODIDE_BASE });
      await instance.loadPackage(PYTHON_RUNTIME_PACKAGES);
      lockdownAttempted = true;
      applyNetworkLockdown(instance);
      return instance;
    })();
  }
  try {
    py = await pyodideLoading;
  } catch (e) {
    // A failed bootstrap must not be cached or half-served. Before any
    // lockdown attempt the worker is still pristine: reset so the next run
    // retries from scratch (F14 semantics). AFTER a lockdown attempt the
    // bootstrap primitives themselves are denied — the worker is marked
    // permanently failed and self-destructs (onmessage rethrows uncaught,
    // the shell's onerror rebuilds a fresh worker that re-bootstraps and
    // re-locks).
    pyodideLoading = null;
    py = null;
    bootPhase = lockdownAttempted ? 'failed' : 'cold';
    throw e;
  }
  bootPhase = 'locked';
  return py;
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function bytesToB64(bytes) {
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}

// Roots whose ENTIRE subtree is owned by the sync protocol and replaced
// wholesale on every run. NEVER rmtree anything else — /, /usr, /home,
// /tmp and Pyodide's own paths are strictly off-limits.
const MANAGED_ROOTS = ['/mnt/workspace', '/mnt/upload', '/mnt/download', '/home/locus'];
// /tmp belongs to Pyodide: syncIn deletes exactly the files AND directories
// IT wrote on the previous run (tracked module-level), never the directory
// itself.
let tmpManagedFiles = [];
let tmpManagedDirs = [];

function rmTree(root) {
  if (MANAGED_ROOTS.indexOf(root) === -1) throw new Error('refusing to rmtree unmanaged root: ' + root);
  py.runPython('import shutil; shutil.rmtree(' + JSON.stringify(root) + ', ignore_errors=True)');
}

// Reset each managed mirror root, then write the incoming snapshot:
// directories FIRST (empty dirs are real filesystem state — the shell cwd
// may point at one), then files. Returns a {ABS path: b64} manifest used
// to detect new/changed/deleted files after the run.
function syncIn(mounts) {
  const manifest = {};
  for (const m of mounts || []) {
    const root = m.root;
    if (MANAGED_ROOTS.indexOf(root) !== -1) {
      rmTree(root);
      py.FS.mkdirTree(root);
    } else if (root === '/tmp') {
      for (const p of tmpManagedFiles) { try { py.FS.unlink(p); } catch (e) {} }
      tmpManagedFiles = [];
      // Deepest first; best-effort (a dir with untracked content stays).
      for (const d of tmpManagedDirs.slice().sort().reverse()) { try { py.FS.rmdir(d); } catch (e) {} }
      tmpManagedDirs = [];
    } else {
      continue; // unknown root: never touched
    }
    for (const d of (m.directories || []).slice().sort()) {
      py.FS.mkdirTree(d);
      if (root === '/tmp') tmpManagedDirs.push(d);
    }
    for (const f of m.files || []) {
      const full = f.path; // absolute VFS path
      const dir = full.substring(0, full.lastIndexOf('/'));
      if (dir) py.FS.mkdirTree(dir);
      py.FS.writeFile(full, b64ToBytes(f.b64));
      manifest[full] = f.b64;
      if (root === '/tmp') tmpManagedFiles.push(full);
    }
    if (m.readOnly) {
      // Best-effort read-only mirror: the authoritative enforcement is the
      // main-thread commit phase (changes under read-only roots are never
      // committed), chmod is defence in depth.
      for (const f of m.files || []) {
        try { py.FS.chmod(f.path, 0o444); } catch (e) {}
      }
    }
  }
  return manifest;
}

// Directory manifest at sync-in time: every mount root, every synced
// directory and every parent of a synced file. Compared against the
// post-run walk to surface created/deleted directories — empty dirs
// included (a file-only diff silently drops them).
function dirManifest(mounts) {
  const dirs = new Set();
  for (const m of mounts || []) {
    const root = m.root;
    dirs.add(root);
    const addWithParents = (p) => {
      let cur = p;
      while (cur && cur !== root && cur.indexOf(root + '/') === 0) {
        dirs.add(cur);
        cur = cur.substring(0, cur.lastIndexOf('/'));
      }
    };
    for (const d of m.directories || []) addWithParents(d);
    for (const f of m.files || []) addWithParents(f.path.substring(0, f.path.lastIndexOf('/')));
  }
  return dirs;
}

// Output caps, enforced inside the worker BEFORE anything is posted to the
// main thread — a runaway print loop or huge artifact must not OOM the page.
const MAX_STDOUT_CHARS = 1024 * 1024;
const MAX_STDERR_CHARS = 1024 * 1024;
const MAX_OUT_FILES = 200;
const MAX_OUT_TOTAL_BYTES = 25 * 1024 * 1024;

function walkFs(dir, prefix, out, dirs) {
  for (const entry of py.FS.readdir(dir)) {
    if (entry === '.' || entry === '..') continue;
    const full = dir + '/' + entry;
    const stat = py.FS.stat(full);
    if (py.FS.isDir(stat.mode)) {
      if (dirs) dirs.push(prefix + entry);
      walkFs(full, prefix + entry + '/', out, dirs);
    } else {
      out.push({ path: prefix + entry, full: full, size: stat.size });
    }
  }
}

function b64Size(b64) {
  const len = b64.length;
  let pad = 0;
  if (b64[len - 1] === '=') pad++;
  if (b64[len - 2] === '=') pad++;
  return Math.floor(len / 4) * 3 - pad;
}

// Collect the output changeset across ALL mount roots; caps are global
// (shared across mounts). Files that cannot be collected within the caps
// are reported as STRUCTURED uncollected paths — the changeset is then
// incomplete and the main thread must not treat deletions as committable
// (a rename target among the uncollected files would lose the source).
// Sizes are checked via stat BEFORE reading/base64-encoding a file.
// All paths in the result are absolute.
// Directories have no content and no caps: created/deleted dirs are
// diffed against the sync-in directory manifest (empty dirs included).
function diffOut(manifest, beforeDirs, mounts) {
  const changed = [];
  const uncollected = [];
  const present = new Set();
  const afterDirs = new Set();
  let total = 0;
  for (const m of mounts || []) {
    const root = m.root;
    let rootStat = null;
    try { rootStat = py.FS.stat(root); } catch (e) { rootStat = null; }
    if (!rootStat || !py.FS.isDir(rootStat.mode)) continue; // mirror root absent — its files read as deleted
    afterDirs.add(root);
    const entries = [];
    const dirList = [];
    walkFs(root, root + '/', entries, dirList);
    for (const d of dirList) afterDirs.add(d);
    for (const e of entries) {
      present.add(e.path);
      const snapB64 = manifest[e.path];
      const snapSize = snapB64 !== undefined ? b64Size(snapB64) : -1;
      if (snapSize >= 0 && e.size === snapSize) {
        // Possibly unchanged (same size as the sync-in snapshot, which is
        // bounded by the sync-in caps): read and compare to be sure.
        const b64 = bytesToB64(py.FS.readFile(e.full));
        if (snapB64 === b64) continue;
        if (changed.length >= MAX_OUT_FILES || total + e.size > MAX_OUT_TOTAL_BYTES) {
          uncollected.push(e.path);
          continue;
        }
        total += e.size;
        changed.push({ path: e.path, b64: b64 });
        continue;
      }
      // Definitely new or changed (no snapshot, or size differs): check the
      // budget from stat.size BEFORE reading the file into memory.
      if (changed.length >= MAX_OUT_FILES || total + e.size > MAX_OUT_TOTAL_BYTES) {
        uncollected.push(e.path);
        continue;
      }
      total += e.size;
      changed.push({ path: e.path, b64: bytesToB64(py.FS.readFile(e.full)) });
    }
  }
  // Files that were synced in but no longer exist after the run were
  // deleted (or renamed away) by the Python code.
  const deleted = [];
  for (const path of Object.keys(manifest)) {
    if (!present.has(path)) deleted.push(path);
  }
  // Directory diff against the sync-in manifest. Mount roots themselves are
  // protocol-managed, never reported. Deterministic order: creates are
  // parent-first (lexicographic order guarantees it), deletes child-first.
  const roots = new Set();
  for (const m of mounts || []) roots.add(m.root);
  const createdDirs = [];
  for (const d of afterDirs) {
    if (!beforeDirs.has(d) && !roots.has(d)) createdDirs.push(d);
  }
  createdDirs.sort();
  const deletedDirs = [];
  for (const d of beforeDirs) {
    if (!afterDirs.has(d) && !roots.has(d)) deletedDirs.push(d);
  }
  deletedDirs.sort().reverse();
  return { changed: changed, deleted: deleted, uncollected: uncollected,
    createdDirs: createdDirs, deletedDirs: deletedDirs };
}

self.onmessage = async (ev) => {
  const msg = ev.data || {};
  if (msg.cmd !== 'run') return;
  const id = msg.id;
  if (bootPhase === 'failed') {
    self.postMessage({ id: id, type: 'result', stdout: '', stderr: '', error: 'Python worker failed to apply the network lockdown', files: [], deleted: [], createdDirs: [], deletedDirs: [], uncollectedFiles: [], stdoutTruncated: false, stderrTruncated: false });
    return;
  }
  try {
    self.postMessage({ id: id, type: 'status', status: 'loading' });
    await ensureLockedPyodide();
    self.postMessage({ id: id, type: 'status', status: 'ready' });

    const manifest = syncIn(msg.mounts || []);
    const beforeDirs = dirManifest(msg.mounts || []);

    let stdout = '';
    let stderr = '';
    let stdoutTruncated = false;
    let stderrTruncated = false;
    py.setStdout({ batched: (s) => {
      if (stdoutTruncated) return;
      stdout += s + '\n';
      if (stdout.length > MAX_STDOUT_CHARS) {
        stdout = stdout.slice(0, MAX_STDOUT_CHARS);
        stdoutTruncated = true;
      }
    } });
    py.setStderr({ batched: (s) => {
      if (stderrTruncated) return;
      stderr += s + '\n';
      if (stderr.length > MAX_STDERR_CHARS) {
        stderr = stderr.slice(0, MAX_STDERR_CHARS);
        stderrTruncated = true;
      }
    } });

    let error = null;
    try {
      // Python runs with the SAME absolute cwd as the shell invocation.
      // Imports are deliberately NOT auto-loaded here: package downloads
      // are a bootstrap-time harness decision (PYTHON_RUNTIME_PACKAGES),
      // never a side effect of model-generated imports. An import the
      // runtime does not carry fails honestly (ModuleNotFoundError) with
      // no network attempt.
      await py.runPythonAsync('import os\nos.chdir(' + JSON.stringify(msg.cwd || '/home/locus') + ')');
      await py.runPythonAsync(msg.code);
    } catch (e) {
      // PythonError messages carry the full traceback.
      error = String(e && e.message ? e.message : e);
    }

    const diff = diffOut(manifest, beforeDirs, msg.mounts || []);
    self.postMessage({
      id: id, type: 'result', stdout: stdout, stderr: stderr, error: error,
      files: diff.changed, deleted: diff.deleted,
      createdDirs: diff.createdDirs, deletedDirs: diff.deletedDirs,
      uncollectedFiles: diff.uncollected,
      stdoutTruncated: stdoutTruncated, stderrTruncated: stderrTruncated,
    });
  } catch (e) {
    self.postMessage({ id: id, type: 'result', stdout: '', stderr: '', error: String(e && e.message ? e.message : e), files: [], deleted: [], createdDirs: [], deletedDirs: [], uncollectedFiles: [], stdoutTruncated: false, stderrTruncated: false });
    if (bootPhase === 'failed') {
      // Uncaught worker error -> shell worker.onerror -> terminate + rebuild.
      setTimeout(() => { throw new Error('Python worker failed to apply the network lockdown'); }, 0);
    }
  }
};
</script>

<script type="text/worker" id="grep-worker-src">
// ============================================================
//  GREP REGEX WORKER — untrusted-pattern compute containment.
//  The grep pattern is model-controlled: RegExp compilation and
//  every match run HERE, never on the main thread, so a
//  catastrophic-backtracking pattern burns this worker (which the
//  shell terminates at the hard timeout, on cancellation, and at
//  the command boundary) instead of freezing the UI event loop.
//  Pure compute: no network, no filesystem, no DOM, no persistence.
//
//  Message in:  { id, cmd: 'init', pattern, flags }
//  Reply out:   { id, type: 'ready' } | { id, type: 'invalid_pattern' }
//
//  Message in:  { id, cmd: 'scan', text, countOnly, maxMatches }
//  Reply out:   countOnly → { id, type: 'result', count }
//               otherwise → { id, type: 'result',
//                             matches: [{ lineNumber, line }],
//                             hitMatchLimit }
//  Every request gets exactly one reply carrying the same id; a
//  request that cannot be honored replies 'internal_error'. Raw
//  patterns and error strings never leave this worker.
// ============================================================

let re = null;

// Line-splitting parity with the shell's splitLines(): '\n' separators,
// and a trailing newline is a terminator, not an empty final line.
function splitLines(text) {
  const lines = String(text).split('\n');
  if (lines.length && lines[lines.length - 1] === '') lines.pop();
  return lines;
}

self.onmessage = (ev) => {
  const msg = (ev && ev.data) || {};
  try {
    if (msg.cmd === 'init') {
      try {
        re = new RegExp(String(msg.pattern), msg.flags ? String(msg.flags) : '');
      } catch (e) {
        re = null;
        self.postMessage({ id: msg.id, type: 'invalid_pattern' });
        return;
      }
      self.postMessage({ id: msg.id, type: 'ready' });
      return;
    }
    if (msg.cmd === 'scan') {
      if (!re) {
        self.postMessage({ id: msg.id, type: 'internal_error' });
        return;
      }
      const lines = splitLines(msg.text);
      if (msg.countOnly) {
        // Count mode answers the TRUE number of matching lines: the
        // GREP_MAX_MATCHES presentation cap never applies here.
        let count = 0;
        for (let i = 0; i < lines.length; i++) {
          if (re.test(lines[i])) count++;
        }
        self.postMessage({ id: msg.id, type: 'result', count: count });
        return;
      }
      const budget = typeof msg.maxMatches === 'number' ? msg.maxMatches : Infinity;
      const matches = [];
      let hitMatchLimit = false;
      for (let i = 0; i < lines.length; i++) {
        if (matches.length >= budget) { hitMatchLimit = true; break; }
        if (re.test(lines[i])) matches.push({ lineNumber: i + 1, line: lines[i] });
      }
      self.postMessage({ id: msg.id, type: 'result', matches: matches, hitMatchLimit: hitMatchLimit });
      return;
    }
    self.postMessage({ id: msg.id, type: 'internal_error' });
  } catch (e) {
    self.postMessage({ id: msg.id, type: 'internal_error' });
  }
};
</script>
