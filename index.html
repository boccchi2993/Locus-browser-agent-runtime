<body>
<div id="app"></div>

<!--
  Pyodide Web Worker source.
  Kept inline (loaded via Blob URL) so the runtime also works when the
  page is served from any static host — browsers block Worker('...js')
  on file origins. The Vue build never touches this block; the runtime
  (src/shell.js) pulls the source out by id.
-->
<script type="text/worker" id="py-worker-src">
// ============================================================
//  PYODIDE WORKER  (protocol v2.1 — adds directory semantics)
//  Loads Pyodide lazily on first run, executes Python against an
//  in-memory mirror of the VFS data mounts, and reports back
//  stdout / stderr / tracebacks / changed files+dirs (ABSOLUTE paths).
//
//  Message in:  { id, cmd: 'run', code, cwd,
//                 mounts: [{ root, readOnly,
//                            files: [{ path(ABS), b64 }],
//                            directories: [ABS] }] }
//  Result out:  { id, type: 'result', stdout, stderr, error,
//                 files: [{ path(ABS), b64 }], deleted: [ABS files],
//                 createdDirs: [ABS], deletedDirs: [ABS],
//                 uncollectedFiles: [ABS],
//                 stdoutTruncated, stderrTruncated }
//  `deleted` is FILES ONLY; directory creates/removals are reported in
//  their own fields (createdDirs parent-first, deletedDirs child-first).
// ============================================================
const PYODIDE_BASE = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';

let py = null;
let pyodideLoading = null;

async function ensurePyodide() {
  if (!pyodideLoading) {
    pyodideLoading = (async () => {
      importScripts(PYODIDE_BASE + 'pyodide.js');
      const instance = await loadPyodide({ indexURL: PYODIDE_BASE });
      return instance;
    })();
  }
  try {
    py = await pyodideLoading;
  } catch (e) {
    // A failed load (CDN unreachable, WASM init error, …) must not be
    // cached: reset so the next run retries from scratch.
    pyodideLoading = null;
    py = null;
    throw e;
  }
  return py;
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function bytesToB64(bytes) {
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}

// Roots whose ENTIRE subtree is owned by the sync protocol and replaced
// wholesale on every run. NEVER rmtree anything else — /, /usr, /home,
// /tmp and Pyodide's own paths are strictly off-limits.
const MANAGED_ROOTS = ['/mnt/workspace', '/mnt/upload', '/mnt/download', '/home/locus'];
// /tmp belongs to Pyodide: syncIn deletes exactly the files AND directories
// IT wrote on the previous run (tracked module-level), never the directory
// itself.
let tmpManagedFiles = [];
let tmpManagedDirs = [];

function rmTree(root) {
  if (MANAGED_ROOTS.indexOf(root) === -1) throw new Error('refusing to rmtree unmanaged root: ' + root);
  py.runPython('import shutil; shutil.rmtree(' + JSON.stringify(root) + ', ignore_errors=True)');
}

// Reset each managed mirror root, then write the incoming snapshot:
// directories FIRST (empty dirs are real filesystem state — the shell cwd
// may point at one), then files. Returns a {ABS path: b64} manifest used
// to detect new/changed/deleted files after the run.
function syncIn(mounts) {
  const manifest = {};
  for (const m of mounts || []) {
    const root = m.root;
    if (MANAGED_ROOTS.indexOf(root) !== -1) {
      rmTree(root);
      py.FS.mkdirTree(root);
    } else if (root === '/tmp') {
      for (const p of tmpManagedFiles) { try { py.FS.unlink(p); } catch (e) {} }
      tmpManagedFiles = [];
      // Deepest first; best-effort (a dir with untracked content stays).
      for (const d of tmpManagedDirs.slice().sort().reverse()) { try { py.FS.rmdir(d); } catch (e) {} }
      tmpManagedDirs = [];
    } else {
      continue; // unknown root: never touched
    }
    for (const d of (m.directories || []).slice().sort()) {
      py.FS.mkdirTree(d);
      if (root === '/tmp') tmpManagedDirs.push(d);
    }
    for (const f of m.files || []) {
      const full = f.path; // absolute VFS path
      const dir = full.substring(0, full.lastIndexOf('/'));
      if (dir) py.FS.mkdirTree(dir);
      py.FS.writeFile(full, b64ToBytes(f.b64));
      manifest[full] = f.b64;
      if (root === '/tmp') tmpManagedFiles.push(full);
    }
    if (m.readOnly) {
      // Best-effort read-only mirror: the authoritative enforcement is the
      // main-thread commit phase (changes under read-only roots are never
      // committed), chmod is defence in depth.
      for (const f of m.files || []) {
        try { py.FS.chmod(f.path, 0o444); } catch (e) {}
      }
    }
  }
  return manifest;
}

// Directory manifest at sync-in time: every mount root, every synced
// directory and every parent of a synced file. Compared against the
// post-run walk to surface created/deleted directories — empty dirs
// included (a file-only diff silently drops them).
function dirManifest(mounts) {
  const dirs = new Set();
  for (const m of mounts || []) {
    const root = m.root;
    dirs.add(root);
    const addWithParents = (p) => {
      let cur = p;
      while (cur && cur !== root && cur.indexOf(root + '/') === 0) {
        dirs.add(cur);
        cur = cur.substring(0, cur.lastIndexOf('/'));
      }
    };
    for (const d of m.directories || []) addWithParents(d);
    for (const f of m.files || []) addWithParents(f.path.substring(0, f.path.lastIndexOf('/')));
  }
  return dirs;
}

// Output caps, enforced inside the worker BEFORE anything is posted to the
// main thread — a runaway print loop or huge artifact must not OOM the page.
const MAX_STDOUT_CHARS = 1024 * 1024;
const MAX_STDERR_CHARS = 1024 * 1024;
const MAX_OUT_FILES = 200;
const MAX_OUT_TOTAL_BYTES = 25 * 1024 * 1024;

function walkFs(dir, prefix, out, dirs) {
  for (const entry of py.FS.readdir(dir)) {
    if (entry === '.' || entry === '..') continue;
    const full = dir + '/' + entry;
    const stat = py.FS.stat(full);
    if (py.FS.isDir(stat.mode)) {
      if (dirs) dirs.push(prefix + entry);
      walkFs(full, prefix + entry + '/', out, dirs);
    } else {
      out.push({ path: prefix + entry, full: full, size: stat.size });
    }
  }
}

function b64Size(b64) {
  const len = b64.length;
  let pad = 0;
  if (b64[len - 1] === '=') pad++;
  if (b64[len - 2] === '=') pad++;
  return Math.floor(len / 4) * 3 - pad;
}

// Collect the output changeset across ALL mount roots; caps are global
// (shared across mounts). Files that cannot be collected within the caps
// are reported as STRUCTURED uncollected paths — the changeset is then
// incomplete and the main thread must not treat deletions as committable
// (a rename target among the uncollected files would lose the source).
// Sizes are checked via stat BEFORE reading/base64-encoding a file.
// All paths in the result are absolute.
// Directories have no content and no caps: created/deleted dirs are
// diffed against the sync-in directory manifest (empty dirs included).
function diffOut(manifest, beforeDirs, mounts) {
  const changed = [];
  const uncollected = [];
  const present = new Set();
  const afterDirs = new Set();
  let total = 0;
  for (const m of mounts || []) {
    const root = m.root;
    let rootStat = null;
    try { rootStat = py.FS.stat(root); } catch (e) { rootStat = null; }
    if (!rootStat || !py.FS.isDir(rootStat.mode)) continue; // mirror root absent — its files read as deleted
    afterDirs.add(root);
    const entries = [];
    const dirList = [];
    walkFs(root, root + '/', entries, dirList);
    for (const d of dirList) afterDirs.add(d);
    for (const e of entries) {
      present.add(e.path);
      const snapB64 = manifest[e.path];
      const snapSize = snapB64 !== undefined ? b64Size(snapB64) : -1;
      if (snapSize >= 0 && e.size === snapSize) {
        // Possibly unchanged (same size as the sync-in snapshot, which is
        // bounded by the sync-in caps): read and compare to be sure.
        const b64 = bytesToB64(py.FS.readFile(e.full));
        if (snapB64 === b64) continue;
        if (changed.length >= MAX_OUT_FILES || total + e.size > MAX_OUT_TOTAL_BYTES) {
          uncollected.push(e.path);
          continue;
        }
        total += e.size;
        changed.push({ path: e.path, b64: b64 });
        continue;
      }
      // Definitely new or changed (no snapshot, or size differs): check the
      // budget from stat.size BEFORE reading the file into memory.
      if (changed.length >= MAX_OUT_FILES || total + e.size > MAX_OUT_TOTAL_BYTES) {
        uncollected.push(e.path);
        continue;
      }
      total += e.size;
      changed.push({ path: e.path, b64: bytesToB64(py.FS.readFile(e.full)) });
    }
  }
  // Files that were synced in but no longer exist after the run were
  // deleted (or renamed away) by the Python code.
  const deleted = [];
  for (const path of Object.keys(manifest)) {
    if (!present.has(path)) deleted.push(path);
  }
  // Directory diff against the sync-in manifest. Mount roots themselves are
  // protocol-managed, never reported. Deterministic order: creates are
  // parent-first (lexicographic order guarantees it), deletes child-first.
  const roots = new Set();
  for (const m of mounts || []) roots.add(m.root);
  const createdDirs = [];
  for (const d of afterDirs) {
    if (!beforeDirs.has(d) && !roots.has(d)) createdDirs.push(d);
  }
  createdDirs.sort();
  const deletedDirs = [];
  for (const d of beforeDirs) {
    if (!afterDirs.has(d) && !roots.has(d)) deletedDirs.push(d);
  }
  deletedDirs.sort().reverse();
  return { changed: changed, deleted: deleted, uncollected: uncollected,
    createdDirs: createdDirs, deletedDirs: deletedDirs };
}

self.onmessage = async (ev) => {
  const msg = ev.data || {};
  if (msg.cmd !== 'run') return;
  const id = msg.id;
  try {
    self.postMessage({ id: id, type: 'status', status: 'loading' });
    await ensurePyodide();
    self.postMessage({ id: id, type: 'status', status: 'ready' });

    const manifest = syncIn(msg.mounts || []);
    const beforeDirs = dirManifest(msg.mounts || []);

    let stdout = '';
    let stderr = '';
    let stdoutTruncated = false;
    let stderrTruncated = false;
    py.setStdout({ batched: (s) => {
      if (stdoutTruncated) return;
      stdout += s + '\n';
      if (stdout.length > MAX_STDOUT_CHARS) {
        stdout = stdout.slice(0, MAX_STDOUT_CHARS);
        stdoutTruncated = true;
      }
    } });
    py.setStderr({ batched: (s) => {
      if (stderrTruncated) return;
      stderr += s + '\n';
      if (stderr.length > MAX_STDERR_CHARS) {
        stderr = stderr.slice(0, MAX_STDERR_CHARS);
        stderrTruncated = true;
      }
    } });

    let error = null;
    try {
      // Auto-install pure-python/wheel packages the code imports (e.g. pandas).
      await py.loadPackagesFromImports(msg.code);
      // Python runs with the SAME absolute cwd as the shell invocation.
      await py.runPythonAsync('import os\nos.chdir(' + JSON.stringify(msg.cwd || '/home/locus') + ')');
      await py.runPythonAsync(msg.code);
    } catch (e) {
      // PythonError messages carry the full traceback.
      error = String(e && e.message ? e.message : e);
    }

    const diff = diffOut(manifest, beforeDirs, msg.mounts || []);
    self.postMessage({
      id: id, type: 'result', stdout: stdout, stderr: stderr, error: error,
      files: diff.changed, deleted: diff.deleted,
      createdDirs: diff.createdDirs, deletedDirs: diff.deletedDirs,
      uncollectedFiles: diff.uncollected,
      stdoutTruncated: stdoutTruncated, stderrTruncated: stderrTruncated,
    });
  } catch (e) {
    self.postMessage({ id: id, type: 'result', stdout: '', stderr: '', error: String(e && e.message ? e.message : e), files: [], deleted: [], createdDirs: [], deletedDirs: [], uncollectedFiles: [], stdoutTruncated: false, stderrTruncated: false });
  }
};
</script>

<script type="module" src="/src/main.js"></script>
